
# Spring Boot Configuration
spring.application.name=ai-study-buddy
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_study_buddy?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Google Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-3.8-flash}

# JWT Security Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# CORS Configuration
cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

# Logging
logging.level.com.aistudybuddy=INFO
logging.level.org.springframework.security=WARN

