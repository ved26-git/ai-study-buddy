# ========================================================
# Test Configuration for JUnit 5 & MockMvc Integration Tests
# Uses in-memory H2 database in MySQL compatibility mode
# ========================================================

spring.datasource.url=jdbc:h2:mem:ai_study_buddy_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Strong 256-bit test secret for cryptographic token validation
jwt.secret=TestSecretKeyMustBeSufficientlyStrongAndAtLeast32BytesLongForHmacSha256!
jwt.expiration-ms=86400000

# Strict CORS test origins
cors.allowed-origins=http://localhost:3000,http://localhost:8080

# Mock Gemini configurations
gemini.api.key=test_gemini_api_key_for_testing
gemini.api.model=gemini-3.8-flash

# Disable MySQL schema.sql initialization during H2 tests
spring.sql.init.mode=never
